databases:
  - name: butcher-db
    databaseName: butcher_production
    user: butcher_user
    plan: free
    region: oregon

services:
  - type: web
    name: butcher-backend
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    # Render routes traffic to port 80 (matches our nginx EXPOSE)
    envVars:
      - key: APP_NAME
        value: ButcherAPI
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: false
      - key: APP_URL
        sync: false           # Set to your Render public URL after first deploy
      - key: APP_KEY
        sync: false           # Run `php artisan key:generate --show` locally and paste the result
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: error
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: butcher-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: butcher-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: butcher-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: butcher-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: butcher-db
          property: password
      - key: CACHE_DRIVER
        value: file
      - key: SESSION_DRIVER
        value: file
      - key: QUEUE_CONNECTION
        value: sync
      - key: SANCTUM_STATELESS_DOMAINS
        sync: false           # Set to your frontend domain(s), comma-separated
